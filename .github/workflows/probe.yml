# Probes the site's rate limit as seen from GitHub's servers. Manual start only.
# Uses no credentials and writes no data: measures how many search-result pages the site
# returns at different rates (requests per second) and reports counts only. See docs/runbook.md.
name: Rate probe

on:
  workflow_dispatch:
    inputs:
      phases:
        description: "Comma-separated phases 'requests_per_second:minutes'"
        type: string
        default: "0.5:45"
      kind:
        description: "Pages to probe: list (search results) or detail"
        type: choice
        options: [list, detail]
        default: list
      concurrency:
        description: "Connections sharing the rate"
        type: string
        default: "1"
      first_page:
        description: "List kind: first search-result page to request"
        type: string
        default: "1"
      dead_first:
        description: "Detail kind: requests for non-existent listings (404) before the valid detail pages"
        type: string
        default: "0"
      dead_every:
        description: "Detail kind: one request for a non-existent listing (404) after every N valid detail pages"
        type: string
        default: "0"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75  # detail kind: ~10 min of URL harvesting before the phases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - name: Install dependencies
        run: uv sync --locked --package scraper --no-dev
      - name: Probe
        env:
          IN_PHASES: ${{ inputs.phases }}
          IN_KIND: ${{ inputs.kind }}
          IN_CONCURRENCY: ${{ inputs.concurrency }}
          IN_FIRST_PAGE: ${{ inputs.first_page }}
          IN_DEAD_FIRST: ${{ inputs.dead_first }}
          IN_DEAD_EVERY: ${{ inputs.dead_every }}
        run: uv run --no-dev python -m scraper probe --phases "$IN_PHASES" --kind "$IN_KIND" --concurrency "$IN_CONCURRENCY" --first-page "$IN_FIRST_PAGE" --dead-first "$IN_DEAD_FIRST" --dead-every "$IN_DEAD_EVERY"
