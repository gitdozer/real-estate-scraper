# Probes the site's rate limit as seen from GitHub's servers. Manual start, plus a
# TEMPORARY nightly schedule for the map (GeoJSON) test decided on 2026-11-14 (remove it
# once the test is read). Uses no credentials and writes no data: measures how many pages
# the site returns at different rates (requests per second) and reports counts only.
# See docs/runbook.md.
name: Rate probe

on:
  schedule:
    - cron: "30 23 * * *"  # TEMPORARY (2026-11-14): map test at night, kind geojson, one request every 10 s
  workflow_dispatch:
    inputs:
      phases:
        description: "Comma-separated phases 'requests_per_second:minutes'"
        type: string
        default: "0.5:45"
      kind:
        description: "Pages to probe: list (search results), detail, or geojson (the map of every segment)"
        type: choice
        options: [list, detail, geojson]
        default: list
      concurrency:
        description: "Connections sharing the rate"
        type: string
        default: "1"
      first_page:
        description: "List kind: first search-result page to request"
        type: string
        default: "1"
      dead_first:
        description: "Detail kind: requests for non-existent listings (404) before the valid detail pages"
        type: string
        default: "0"
      dead_every:
        description: "Detail kind: one request for a non-existent listing (404) after every N valid detail pages"
        type: string
        default: "0"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75  # detail kind: ~10 min of URL harvesting before the phases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - name: Install dependencies
        run: uv sync --locked --package scraper --no-dev
      - name: Probe
        # A scheduled run has no inputs: it runs the map test (kind geojson at 0.1 req/s).
        env:
          IN_PHASES: ${{ inputs.phases || '0.1:10' }}
          IN_KIND: ${{ inputs.kind || 'geojson' }}
          IN_CONCURRENCY: ${{ inputs.concurrency || '1' }}
          IN_FIRST_PAGE: ${{ inputs.first_page || '1' }}
          IN_DEAD_FIRST: ${{ inputs.dead_first || '0' }}
          IN_DEAD_EVERY: ${{ inputs.dead_every || '0' }}
        run: uv run --no-dev python -m scraper probe --phases "$IN_PHASES" --kind "$IN_KIND" --concurrency "$IN_CONCURRENCY" --first-page "$IN_FIRST_PAGE" --dead-first "$IN_DEAD_FIRST" --dead-every "$IN_DEAD_EVERY"
