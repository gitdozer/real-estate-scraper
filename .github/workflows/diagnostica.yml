# Diagnosi del limite di frequenza del sito visto dai server di GitHub. Solo avvio manuale.
# Non usa credenziali e non scrive dati: misura quante pagine elenco il sito restituisce
# a ritmi diversi (richieste al secondo) e riporta solo conteggi. Vedi docs/runbook.md.
name: Diagnosi ritmo

on:
  workflow_dispatch:
    inputs:
      phases:
        description: "Fasi 'richieste_al_secondo:minuti' separate da virgola"
        type: string
        default: "0.5:45"
      kind:
        description: "Pages to probe: list (search results) or detail"
        type: choice
        options: [list, detail]
        default: list
      concurrency:
        description: "Connections sharing the rate"
        type: string
        default: "1"
      first_page:
        description: "List kind: first search-result page to request"
        type: string
        default: "1"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75  # detail kind: ~10 min of URL harvesting before the phases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - name: Installa le dipendenze
        run: uv sync --locked --package scraper --no-dev
      - name: Diagnosi
        env:
          IN_PHASES: ${{ inputs.phases }}
          IN_KIND: ${{ inputs.kind }}
          IN_CONCURRENCY: ${{ inputs.concurrency }}
          IN_FIRST_PAGE: ${{ inputs.first_page }}
        run: uv run --no-dev python -m scraper probe --phases "$IN_PHASES" --kind "$IN_KIND" --concurrency "$IN_CONCURRENCY" --first-page "$IN_FIRST_PAGE"
