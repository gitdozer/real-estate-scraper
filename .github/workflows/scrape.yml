# Daily collection of listings. Guide: docs/runbook.md
# Actions are pinned to an exact commit (security and reproducibility); the comment gives the version.
# The repository is public, so the logs are public. The scraper writes ONLY aggregate
# counts to the logs and the summary; the data goes to Cloudflare R2.
name: Daily collection

on:
  # Schedule SUSPENDED on 2026-11-14: since 2026-11-12 the site blocks the search results from
  # GitHub's IPs (hanging requests after ~100-200 pages, or 403 from the first request), so a
  # nightly run writes nothing useful (docs/sources/trovacasa.md). Manual runs stay possible.
  # To resume, restore:
  #   schedule:
  #     - cron: "17 2 * * *"  # 02:17 UTC = Italian night; odd minute to avoid GitHub's load peaks
  workflow_dispatch:
    inputs:
      cities:
        description: "Municipalities (comma-separated slugs, empty = all)"
        type: string
        default: ""
      full_details:
        description: "Download the detail page of every listing"
        type: boolean
        default: false
      max_pages:
        description: "Maximum pages per segment (0 = all; >0 for tests only, blocks disappearances)"
        type: number
        default: 0
      max_runtime_minutes:
        description: "Maximum run duration in minutes (at most 330 with the default job limit)"
        type: number
        default: 330
      dry_run:
        description: "Run without writing anything"
        type: boolean
        default: false
      job_timeout_minutes:
        description: "Job safety limit in minutes (max 350; must exceed the maximum run duration)"
        type: number
        default: 350

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Safety net: the scraper manages the real deadline. The scheduled run has no inputs → 350.
    timeout-minutes: ${{ fromJSON(format('{0}', inputs.job_timeout_minutes || 350)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - name: Install dependencies
        run: uv sync --locked --package scraper --no-dev
      - name: Collect
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          IN_CITIES: ${{ inputs.cities }}
          IN_FULL: ${{ inputs.full_details }}
          IN_MAX_PAGES: ${{ inputs.max_pages }}
          IN_RUNTIME: ${{ inputs.max_runtime_minutes }}
          IN_DRY: ${{ inputs.dry_run }}
        run: |
          args=(run --storage r2)
          [ -n "$IN_CITIES" ] && args+=(--cities "$IN_CITIES")
          [ "$IN_FULL" = "true" ] && args+=(--full-details)
          [ -n "$IN_MAX_PAGES" ] && [ "$IN_MAX_PAGES" != "0" ] && args+=(--max-pages "$IN_MAX_PAGES")
          [ -n "$IN_RUNTIME" ] && args+=(--max-runtime-minutes "$IN_RUNTIME")
          [ "$IN_DRY" = "true" ] && args+=(--dry-run)
          uv run --no-dev python -m scraper "${args[@]}"
