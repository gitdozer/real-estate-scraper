[project]
name = "scraper"
version = "0.2.5"
description = "Daily collection of real-estate listings (phase 1)"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "selectolax",
    "polars",
    "pyarrow",
    "boto3",
    "imagehash",
    "pillow",
    "pydantic>=2",
    "pyyaml",
    "tzdata",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
